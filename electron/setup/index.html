<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Zenith — Setup</title>
<style>
  :root {
    color-scheme: dark;
  }
  body {
    margin: 0;
    padding: 28px;
    background: #0a0a0a;
    color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  p.subtitle {
    font-size: 12.5px;
    color: #a1a1aa;
    margin: 0 0 20px;
  }
  label {
    display: block;
    font-size: 11px;
    color: #a1a1aa;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    background: transparent;
    border: 1px solid #3f3f46;
    border-radius: 8px;
    padding: 8px 10px;
    color: #e5e5e5;
    font-size: 13px;
    margin-bottom: 16px;
  }
  input:focus {
    outline: none;
    border-color: #71717a;
  }
  button {
    width: 100%;
    background: #e5e5e5;
    color: #0a0a0a;
    border: none;
    border-radius: 8px;
    padding: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  p.error {
    color: #f87171;
    font-size: 12px;
    margin: 0 0 16px;
    display: none;
  }
  p.hint {
    font-size: 11px;
    color: #71717a;
    margin: -10px 0 16px;
  }
</style>
</head>
<body>
  <h1>Zenith</h1>
  <p class="subtitle">One-time setup — connects the app to your database. This only shows once.</p>

  <form id="setup-form">
    <label for="database-url">Database URL</label>
    <input id="database-url" type="text" placeholder="postgresql://...pooler.supabase.com:6543/postgres" required autofocus />
    <p class="hint">The pooled (Supavisor) connection string from your Supabase project.</p>

    <label for="github-token">GitHub Token (optional)</label>
    <input id="github-token" type="text" placeholder="For syncing private repos" />

    <p class="error" id="error"></p>

    <button type="submit" id="submit">Connect</button>
  </form>

  <script src="setup.js"></script>
</body>
</html>
