name: Zenith
options:
  bundleIdPrefix: com.zolboo
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true

packages:
  ZenithData:
    path: Packages/ZenithData
  ZenithAI:
    path: Packages/ZenithAI

targets:
  Zenith:
    type: application
    platform: macOS
    sources:
      - path: Zenith
    dependencies:
      - package: ZenithData
      - package: ZenithAI
    settings:
      base:
        PRODUCT_NAME: Zenith
        PRODUCT_BUNDLE_IDENTIFIER: com.zolboo.zenith
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.4"
        # Ad-hoc signing only — no Apple Developer Program membership, no
        # notarization, personal-use single-Mac app (per the plan's
        # explicit decision). "-" is the ad-hoc identity: no certificate,
        # no keychain identity, no team needed — just enough of a
        # signature for Gatekeeper/the Sequoia+ code-signing requirement
        # to let a locally-built app run. `CODE_SIGN_STYLE: Manual` (not
        # Automatic) so this is reproducible headlessly via `xcodebuild`
        # without Xcode's UI ever needing to resolve a team.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

schemes:
  Zenith:
    build:
      targets:
        Zenith: all
    run:
      config: Debug
    archive:
      config: Release
